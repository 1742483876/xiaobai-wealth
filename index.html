async function dec(pw){const raw=Uint8Array.from(atob(D),c=>c.charCodeAt(0));const salt=raw.slice(8,16),ct=raw.slice(16);
const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveBits"]);
const bits=new Uint8Array(await crypto.subtle.deriveBits({name:"PBKDF2",salt,iterations:200000,hash:"SHA-256"},k,384));
const key=await crypto.subtle.importKey("raw",bits.slice(0,32),"AES-CBC",false,["decrypt"]);
return new TextDecoder().decode(await crypto.subtle.decrypt({name:"AES-CBC",iv:bits.slice(32,48)},key,ct));}
async function open_(pw){try{const h=await dec(pw);document.getElementById("app").innerHTML=h;document.getElementById("app").style.display="";document.getElementById("lock").remove();
if(document.getElementById("rm")?.checked!==false)localStorage.setItem("xbw",pw);}catch(e){localStorage.removeItem("xbw");document.getElementById("msg").textContent="密码不对";}}
document.getElementById("go").onclick=()=>open_(document.getElementById("pw").value);
document.getElementById("pw").onkeydown=e=>{if(e.key==="Enter")open_(e.target.value)};
if(localStorage.getItem("xbw"))open_(localStorage.getItem("xbw"));
</script></body></html>
